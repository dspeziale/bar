{% macro allergen_checkboxes(active_keys) %}
<div class="row">
  {% for key, label, icon in allergens %}
  <div class="col-6 col-sm-4">
    <div class="form-check">
      <input type="checkbox" name="allergens" value="{{ key }}"
             class="form-check-input"
             {{ 'checked' if key in active_keys }}>
      <label class="form-check-label">{{ icon }} {{ label }}</label>
    </div>
  </div>
  {% endfor %}
</div>
{% endmacro %}
